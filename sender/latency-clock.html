<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Latency clock</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; }
  body { display: flex; align-items: center; justify-content: center;
         font: bold 18vw/1 ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<div id="t">00:00.000</div>
<script>
  // Shows seconds.milliseconds. Put it in OBS as a Browser Source (Local file),
  // and also open it in a browser on the Mac. Photograph the Mac screen and a TV
  // together: the difference between the two clocks is the end-to-end delay.
  const el = document.getElementById('t');
  function tick() {
    const d = new Date();
    const mm = String(d.getMinutes()).padStart(2, '0');
    const ss = String(d.getSeconds()).padStart(2, '0');
    const ms = String(d.getMilliseconds()).padStart(3, '0');
    el.textContent = mm + ':' + ss + '.' + ms;
    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
