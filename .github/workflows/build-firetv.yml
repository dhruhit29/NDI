name: Build Fire TV app

on:
  push:
    paths:
      - "firetv/**"
      - ".github/workflows/build-firetv.yml"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: firetv
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/MandirTV.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MandirTV-apk
          path: out/MandirTV.apk

      # Every build is published as the "latest" release, so this link always
      # gives the newest app (used by the Downloader app on the TVs):
      # https://github.com/<owner>/<repo>/releases/latest/download/MandirTV.apk
      - name: Publish as latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Mandir TV build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/MandirTV.apk
